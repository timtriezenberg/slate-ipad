<script>(function(){var t='system';try{t=window.slateNative?window.slateNative.themeGet():(localStorage.getItem('slate-theme')||'system')}catch(e){}var d=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'})();</script>
<style>
@font-face{font-family:"Big Shoulders";src:url(fonts/BigShoulders-Bold.ttf);font-weight:700;font-display:block}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-Regular.ttf);font-weight:400;font-display:block}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-Bold.ttf);font-weight:700;font-display:block}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-Italic.ttf);font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-BoldItalic.ttf);font-weight:700;font-style:italic;font-display:block}
@font-face{font-family:"Plex Mono";src:url(fonts/IBMPlexMono-Regular.ttf);font-weight:400;font-display:block}
@font-face{font-family:"Plex Mono";src:url(fonts/IBMPlexMono-Bold.ttf);font-weight:700;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic;font-display:block}
/* Slate look: paper + ink + slate orange (light) / chalkboard (dark). */
:root{--font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Big Shoulders","Bahnschrift","Arial Narrow",Impact,sans-serif;--font-mono:"Plex Mono",ui-monospace,Menlo,Consolas,monospace;--font-serif:"Instrument Serif",Georgia,"Times New Roman",serif;--r:3px;
--bg:#e4d7b8;--panel:#f2e8cf;--text:#1c1a16;--muted:#7b705c;--line:#d6c7a3;--line2:#bfad82;--accent:#d4401c;--on-accent:#fff7ee;--accent-soft:#efd6bf;--sel:#f6dfa0;--head:#e6d8b4;--danger:#b3261e;--ok:#2e6b3d;--bar:#1c1a16;--bar-text:#f3ecda;--bar-muted:#a59c86;--shade:rgba(28,26,22,.14);--shadow:0 10px 34px rgba(40,30,10,.28);--grain:.07;color-scheme:light}
:root[data-theme=dark]{--bg:#14161a;--panel:#1c1f24;--text:#ece6d4;--muted:#979080;--line:#2c3036;--line2:#41464e;--accent:#ff7f45;--on-accent:#1b0f07;--accent-soft:#3a281d;--sel:#3b3320;--head:#23272c;--danger:#ff7165;--ok:#86c98b;--bar:#0b0c0e;--bar-text:#ece6d4;--bar-muted:#8d8672;--shade:rgba(0,0,0,.5);--shadow:0 10px 40px rgba(0,0,0,.65);--grain:.05;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .32 0 0 0 0 .2 0 0 0 1 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#app{height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1.5px solid var(--line2);border-radius:var(--r);padding:5px 11px;cursor:pointer;white-space:nowrap;font-weight:700;letter-spacing:.01em}
button:hover{background:var(--head);border-color:var(--text)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:2px 2px 0 var(--shade)}
button.primary:hover{background:var(--accent);border-color:var(--text);filter:brightness(1.06)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--head)}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:4px 7px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
kbd{font:10.5px var(--font-mono);background:var(--head);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bar);color:var(--bar-text);border-bottom:3px solid var(--accent)}
.top .muted{color:var(--bar-muted)}
.top button{background:transparent;color:var(--bar-text);border-color:rgba(236,230,212,.3)}
.top button:hover{background:rgba(255,255,255,.1);border-color:var(--bar-text)}
.top button.ghost{border-color:transparent}
 button.primary kbd{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.3);color:var(--on-accent)}
.top kbd{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--bar-text)}
.top input.bname{color:var(--bar-text)}
.top input.bname:hover{border-color:rgba(236,230,212,.4)}
.top details.dd>summary{background:transparent;color:var(--bar-text);border:1.5px solid rgba(236,230,212,.3);font-weight:700}
.top details.dd .menu{left:auto;right:0;color:var(--text)}
.logo{font:700 24px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:9px;cursor:pointer;padding-top:2px}
.logo i{width:24px;height:17px;border:2px solid var(--bar-text);background:repeating-linear-gradient(115deg,var(--bar-text) 0 4px,var(--bar) 4px 8px);display:inline-block;transform:rotate(-6deg)}
.bname{font:700 20px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;border-color:transparent;background:transparent;min-width:120px;max-width:340px}
.bname:hover{border-color:var(--line2)}
.sp{flex:1}
.pill{font:11px var(--font-mono);color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:2px 9px}
.pill.ok{color:var(--ok)}
.top .pill{color:var(--bar-muted);border-color:rgba(236,230,212,.25)}
.top .pill.ok{color:#9fd6a4}
.top .pill.bad,.pill.bad{color:#fff;background:#c0392b;border-color:#c0392b;font-weight:700}
#savebar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#c0392b;color:#fff;font-size:13px;border-bottom:1.5px solid var(--text);position:sticky;top:0;z-index:50}
#savebar button{background:#fff;color:#1b1d22}
.tabs{display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line2)}
.tab{padding:10px 14px 8px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);font:700 11.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase}
.tab:hover{background:transparent;color:var(--text);border-color:transparent;border-bottom-color:var(--line2)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:6px;padding:7px 14px;flex-wrap:wrap;background:var(--bg)}
.tb label{color:var(--muted);font-size:12px}
.crumbs{padding:0 14px 6px;display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
.crumbs a{color:var(--text);cursor:pointer}
.crumbs a:hover{color:var(--accent)}
details.dd{position:relative}
details.dd>summary{list-style:none;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:5px 10px;cursor:pointer}
details.dd>summary::-webkit-details-marker{display:none}
details.dd .menu{position:absolute;z-index:30;top:32px;left:0;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:190px}
details.dd .menu label{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;color:var(--text);font-size:13px}
details.dd .menu label:hover{background:var(--head)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.gridwrap{flex:1;min-height:0;overflow:auto;margin:0 14px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.grid th{position:sticky;top:0;z-index:5;background:var(--head);text-align:left;font:700 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
table.grid th.num{text-align:right}
table.grid th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
table.grid th .rz:hover{background:var(--accent);opacity:.5}
table.grid td{padding:0 8px;height:27px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;scroll-margin-top:34px;scroll-margin-bottom:34px}
table.grid td.num{text-align:right;font:12px var(--font-mono);font-variant-numeric:tabular-nums}
table.grid td.gut{padding:0 2px;text-align:center;background:var(--head);color:var(--muted);cursor:default;border-right:1px solid var(--line2)}
.caret{cursor:pointer;padding:2px 4px;border-radius:4px}
.caret:hover{background:var(--line2)}
.cm{color:var(--accent);font-size:9px}
td.ro{background:color-mix(in srgb,var(--head) 55%,transparent)}
td .man{display:inline-block;width:0;height:0;border-top:7px solid var(--accent);border-left:7px solid transparent;position:absolute;top:0;right:0}
td.num{position:relative}
tr.t-account td{font-weight:600;background:color-mix(in srgb,var(--head) 70%,var(--panel))}
tr.t-account td.ro{background:color-mix(in srgb,var(--head) 90%,var(--panel))}
/* account outline: each top-level category gets a colour stripe; sub-accounts are lighter bands; lines get tree guides */
tr[style*="--g"] td.gut{box-shadow:inset 5px 0 0 var(--g)}
tr.t-account.d0 td{background:color-mix(in srgb,var(--g,var(--head)) 14%,var(--panel));font-weight:700;border-top:2px solid var(--text)}
tr.t-account.d0 td[data-c=number]{font-family:var(--font-mono,monospace);letter-spacing:.02em}
tr.t-account.d0 td[data-c=name] .nm{text-transform:uppercase;letter-spacing:.04em;font-size:12.5px}
tr.t-account.d1 td,tr.t-account.d2 td,tr.t-account.d3 td{background:color-mix(in srgb,var(--g,var(--head)) 7%,var(--panel));font-weight:650;border-top:1px solid var(--line2)}
tr.t-account.d0.open td{border-bottom:1px solid color-mix(in srgb,var(--g,var(--text)) 50%,transparent)}
tr.t-line.d1 td,tr.t-line.d2 td,tr.t-line.d3 td{background:var(--panel)}
td .tree{position:absolute;left:4px;top:0;bottom:0;display:flex;pointer-events:none}
td .tree i{display:block;width:16px;height:100%;background:linear-gradient(color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2)),color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2))) 7px 0/1.5px 100% no-repeat}
td .tree i:last-child{background:linear-gradient(color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2)),color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2))) 7px 0/1.5px 100% no-repeat,linear-gradient(color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2)),color-mix(in srgb,var(--g,var(--line2)) 55%,var(--line2))) 7px 13px/8px 1.5px no-repeat}
td .kids{display:inline-block;margin-left:8px;padding:0 6px;border-radius:9px;font:600 10.5px var(--font-mono,monospace);background:color-mix(in srgb,var(--g,var(--text)) 18%,transparent);color:var(--text);vertical-align:1px}
tr.t-foot td{height:24px;font-size:12px;font-weight:700;color:var(--muted);border-top:1px dashed color-mix(in srgb,var(--g,var(--line2)) 60%,var(--line2));border-bottom:2px solid color-mix(in srgb,var(--g,var(--line2)) 45%,var(--line2));background:color-mix(in srgb,var(--g,var(--head)) 5%,var(--panel))}
tr.t-foot td.num{color:var(--text)} tr.t-foot.d0 td .nm{text-transform:uppercase;letter-spacing:.04em}
.caret{font-size:13px}
tr.t-subtotal td{font-weight:700;border-top:1px solid var(--line2);background:var(--head)}
tr.t-markup td{font-style:italic}
td.sel{background:var(--sel)!important}
td.foc{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
td.editing{padding:0;overflow:visible}
input.ed{width:100%;height:100%;border:0;border-radius:0;padding:0 8px;background:var(--panel);outline:2px solid var(--accent);outline-offset:-2px;position:absolute;inset:0;font-variant-numeric:tabular-nums}
td.num input.ed{text-align:right}
.muted{color:var(--muted)}
.neg{color:var(--danger)}
.pos{color:var(--ok)}
.f{color:var(--accent);font-size:10px;margin-right:3px;font-style:italic}
.chip{display:inline-block;border-radius:var(--r);font-family:var(--font-mono);font-size:10.5px;padding:0 7px;font-size:11px;line-height:17px;margin-right:3px;color:#fff}
.chip.soft{background:var(--head);color:var(--text);border:1px solid var(--line2)}
table.grid tfoot td{position:sticky;bottom:0;background:var(--head);font-weight:700;border-top:2px solid var(--line2);z-index:4;height:30px}
#sug{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);min-width:140px;padding:3px;max-height:220px;overflow:auto}
#sug div{padding:4px 9px;border-radius:5px;cursor:pointer}
#sug div.on{background:var(--accent);color:var(--on-accent)}
#ctx{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;min-width:240px}
#ctx div{display:flex;justify-content:space-between;gap:20px;padding:5px 10px;border-radius:var(--r);cursor:pointer}
#ctx div:hover{background:var(--accent);color:var(--on-accent)}
#ctx div:hover kbd{color:var(--text)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.modal-back{position:fixed;inset:0;background:rgba(14,12,8,.55);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);width:min(640px,94vw);max-height:80vh;overflow:auto;padding:18px 20px}
.modal h2{margin:0 0 12px;font:700 26px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.modal .row{display:flex;gap:8px;align-items:center;margin:7px 0}
.modal .row>label{width:130px;color:var(--muted)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pal{width:min(620px,94vw);padding:0}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:var(--r) 14px 0 0;padding:14px 18px;font-size:15px}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .it{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-radius:var(--r);cursor:pointer}
.pal .it.on{background:var(--accent);color:var(--on-accent)}
.pal .it small{opacity:.7}
.page{flex:1;overflow:auto;padding:18px 24px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font:700 20px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
table.simple{border-collapse:collapse;width:100%}
table.simple th{text-align:left;color:var(--muted);font:700 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.simple td{padding:5px 8px;border-bottom:1px solid var(--line)}
table.simple td.num,table.simple th.num{text-align:right;font-variant-numeric:tabular-nums}
table.simple td.num{font-family:var(--font-mono);font-size:12px}
table.simple tr.tot td{font-weight:700;border-top:2px solid var(--line2)}
table.simple input,table.simple select{width:100%}
.hero{max-width:1000px;margin:0 auto}
.hero h1{font:700 40px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;margin:20px 0 4px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bcard:hover{border-color:var(--accent)}
.bcard .big{font:700 26px var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:8px;background:var(--head);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.over i{background:var(--danger)}
.bar.near i{background:#d99a1e}
/* spending caps */
td .capbar{position:absolute;left:8px;right:8px;bottom:3px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
td .capbar i{display:block;height:100%;background:var(--ok)}
.capbar.near i{background:#d99a1e}.capbar.over i{background:var(--danger)}
.capl.over{color:var(--danger);font-weight:700}.capl.near{color:#b7791f}
:root[data-theme=dark] .capl.near{color:#f0b45a}
td .capset{font-size:11px;opacity:.55}
.capchip{margin-left:8px;font:700 10px var(--font-mono,monospace);letter-spacing:.03em;padding:1px 6px;border-radius:99px;border:1px solid currentColor;color:var(--ok);text-transform:none}
.capchip.near{color:#b7791f}:root[data-theme=dark] .capchip.near{color:#f0b45a}
.capchip.over{color:#fff;background:var(--danger);border-color:var(--danger)}
.top summary,.top .pill,.top button{white-space:nowrap}
/* account page */
.acctpage{margin:0 14px 8px;background:var(--panel);border:1.5px solid var(--text);border-top:6px solid var(--g,var(--accent));box-shadow:4px 4px 0 var(--shade)}
.ap-nav{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px dashed var(--line2);flex-wrap:wrap;font-size:12px}
.ap-nav .sp{flex:1}
.ap-main{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(220px,1.5fr) minmax(280px,1.5fr) auto;gap:20px;padding:12px 16px 14px;align-items:center}
.ap-title h2{margin:3px 0 4px;font:700 30px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.ap-stats{display:flex;gap:18px;flex-wrap:wrap}
.ap-stats>div{display:flex;flex-direction:column;gap:2px}
.ap-stats span,.ap-cap>label{font:600 10.5px var(--font-mono,monospace);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.ap-stats b{font:700 18px var(--font-mono,monospace);font-variant-numeric:tabular-nums}
.ap-cap input{width:170px;text-align:right;font-weight:700;margin:4px 0 2px}
.capline{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:13px;flex-wrap:wrap}
.capline.over b{color:var(--danger)}.capline.near b{color:#b7791f}
.ap-acts{display:flex;flex-direction:column;gap:6px}
details.dd .menu.jump{max-height:60vh;overflow:auto;min-width:360px}
details.dd .menu.jump label.on{background:var(--accent-soft)}
@media(max-width:1250px){.ap-main{grid-template-columns:1fr 1fr}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bar);color:var(--bar-text);border:1.5px solid var(--accent);padding:9px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:.2s;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%)}
.help-grid{display:grid;grid-template-columns:1fr auto;gap:5px 18px}
.help-grid h4{grid-column:1/-1;margin:12px 0 2px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.banner{background:var(--accent-soft);border:1px solid var(--line2);border-radius:var(--r);padding:9px 14px;margin:0 14px 8px;display:flex;gap:10px;align-items:center}

/* ---------- landing / accounts / template chooser ---------- */
.landing{max-width:1100px;margin:0 auto}
.clapstrip{height:16px;border:1.5px solid var(--text);background:repeating-linear-gradient(115deg,var(--text) 0 16px,var(--panel) 16px 32px);margin-top:6px}
.mast{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid var(--text);padding:16px 0 14px;margin-bottom:20px}
.kicker{font:700 11px var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.mast h1{font-size:84px;line-height:.86;margin:8px 0 0}

function setupChange(el) {
  const arr = el.dataset.setup, i = +el.dataset.i, f = el.dataset.f; const v = el.type === 'checkbox' ? el.checked : el.value;
  let rerender = false;
  mutate(b => {
    if (arr === 'gvary') { const g = b.globals[i]; g.vary = g.vary || {}; if (v === '') delete g.vary[f]; else g.vary[f] = v; return; }
    const o = b[arr][i];
    if (arr === 'phases') {
      if (f === 'otq' || f === 'otx') { o.ot = o.ot || {}; o.ot[f === 'otq' ? 'qty' : 'x'] = v; }
      else if (f === 'formula') {
        o.formula = String(v).replace(/@\{([^}]+)\}|@([A-Za-z][A-Za-z0-9_ ]*?)(?=\s*[-+*/()]|\s*$)/g, (m, id, nm) => { if (id) return m; const p = b.phases.find(z => z.name.toLowerCase() === nm.trim().toLowerCase()); return p ? '@{' + p.id + '}' : m; });
      }
      else { o[f] = v; if (f === 'type' || f === 'hidden') rerender = true; }
    } else if (arr === 'tags' && f === 'name') {
      const old = o.name; o.name = v; walk(b.rows, r => { r.tags = (r.tags || []).map(t => t === old ? v : t); });
    } else if (arr === 'fringes' && f === 'name') {
      const old = o.name; o.name = v; walk(b.rows, r => { r.fringes = (r.fringes || []).map(t => t === old ? v : t); });
    } else if (arr === 'fringes' && (f === 'rate' || f === 'cutoff')) o[f] = parseFloat(v) || 0;
    else o[f] = v;
    if (arr === 'globals' && f === 'symbol') o.symbol = String(v).replace(/[^A-Za-z0-9_]/g, '');
  }, {render:rerender});
  fixScope();
}

function exportCSV() {
  const b = cur(); const ph = editPhase(b); const memo = calc(); const gv = makeGv(b, ph.id);

  walk(b.rows, (r, p, d) => {
    const v = (r.values && r.values[ph.id]) || {}; const isL = r.type === 'line';
    out.push([r.number || '', '    '.repeat(d) + r.name, r.notes || '', isL ? N(v.qty, gv) || '' : '', isL ? (v.unit || '') : '', isL || r.type === 'markup' ? (v.rate == null ? '' : N(v.rate, gv)) : '', (r.tags || []).join('; ')]
      .concat(b.phases.filter(p => !p.hidden).map(p => ((memo[p.id] && memo[p.id].get(r.id)) || 0).toFixed(2)), (() => { const ci = capInfo(b, r, memo); return ci ? [ci.cap.toFixed(2), ci.left.toFixed(2)] : ['', '']; })()));

  out.push([]); out.push(['#SLATE', 'Slate uses the rows below to import this budget on another computer. Don’t edit them.']);
  const enc = btoa(unescape(encodeURIComponent(budgetFileText(b))));
  for (let i = 0; i < enc.length; i += 30000) out.push(['#SLATE-DATA', 'S:' + enc.slice(i, i + 30000)]);
  if (NATIVE) saveNowSync(); else flushEdits();
  download(b.name.replace(/[^\w\- ]+/g, '') + ' ' + localDay() + '.csv', out.map(r => r.map(q).join(',')).join('\n'), 'text/csv');

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
/* Import Budget from a CSV. A CSV that Slate exported carries the full budget at the bottom, so it comes back
   exactly (transactions, caps, phases, everything). Any other budget CSV (or one edited in Excel without those
   rows) is rebuilt from its columns: Acct, Description (indented = inside an account), Qty, Unit, Rate, Tags, Cap. */
function importCSV(text, fname) {
  const rows = parseCSV(text);
  const data = rows.filter(r => r[0] === '#SLATE-DATA').map(r => String(r[1] || '').replace(/^S:/, '')).join('');
  if (data) {
    let json; try { json = decodeURIComponent(escape(atob(data))); } catch (e) { return toast('The Slate data in that CSV is damaged. Export it again from the other computer'); }
    return importText(json, fname);
  }
  const hi = rows.findIndex(r => r.some(c => /^description$/i.test(String(c).trim())));
  if (hi < 0) return toast('That CSV doesn’t look like a budget (no Description column)');
  const H = rows[hi].map(c => String(c).trim().toLowerCase()); const col = n => H.indexOf(n);
  const cD = col('description'), cA = col('acct'), cN = col('notes'), cQ = col('qty'), cU = col('unit'), cR = col('rate'), cT = col('tags'), cC = col('cap');
  const cE = H.findIndex(h => h === 'estimate' || h === 'budget' || h === 'total' || h === 'amount');
  const num = v => { const n = parseFloat(String(v ?? '').replace(/[$,\s]/g, '').replace(/^\((.*)\)$/, '-$1')); return isFinite(n) ? n : null; };
  const b = templateBudget(); b.id = uid(); b.name = String(fname || 'Imported budget').replace(/\.csv$/i, '').replace(/\s\d{4}-\d\d-\d\d$/, '') || 'Imported budget'; b.rows = []; b.transactions = [];
  const est = primaryPhase(b);
  const items = [];
  rows.slice(hi + 1).forEach(r => {
    const raw = String(r[cD] ?? ''); const name = raw.trim();
    if (!name || /^#SLATE/.test(r[0] || '') || /^grand total$/i.test(name)) return;
    items.push({r, name, depth: Math.floor((raw.length - raw.replace(/^ +/, '').length) / 4)});
  });
  if (!items.length) return toast('No budget lines found in that CSV');
  const stack = [];
  items.forEach((it, i) => {
    const isAcct = items[i + 1] && items[i + 1].depth > it.depth;
    const row = {id:uid(), type:isAcct ? 'account' : 'line', number:cA >= 0 ? String(it.r[cA] || '').trim() : '', name:it.name, notes:cN >= 0 ? String(it.r[cN] || '') : '', values:{}, tags:[], children:[]};
    if (cT >= 0 && it.r[cT]) row.tags = String(it.r[cT]).split(/[;,]/).map(x => x.trim()).filter(Boolean);
    if (cC >= 0 && num(it.r[cC]) > 0) row.cap = num(it.r[cC]);
    if (!isAcct) {
      const v = {}; const qn = cQ >= 0 ? num(it.r[cQ]) : null, rn = cR >= 0 ? num(it.r[cR]) : null, en = cE >= 0 ? num(it.r[cE]) : null;
      if (qn != null) v.qty = qn; if (rn != null) v.rate = rn; if (cU >= 0 && it.r[cU]) v.unit = String(it.r[cU]).trim();
      if (rn == null && en != null) { v.qty = qn ?? 1; v.rate = qn ? Math.round(en / qn * 100) / 100 : en; }
      row.values[est.id] = v;
    }
    while (stack.length && stack[stack.length - 1].depth >= it.depth) stack.pop();
    (stack.length ? stack[stack.length - 1].row.children : b.rows).push(row);
    if (isAcct) stack.push({row, depth:it.depth});
  });
  const known = new Set((b.tags || []).map(t => t.name)); walk(b.rows, r => (r.tags || []).forEach(t => { if (!known.has(t)) { known.add(t); (b.tags = b.tags || []).push({name:t, color:'#8a8f98'}); } }));
  b.created = b.updated = Date.now();
  S.budgets.push(b); save(); render();
  toast('Imported “' + b.name + '” from a CSV: ' + items.length + ' rows. (Only the budget lines: this CSV has no transactions in it.)');
}
function importAny(text, fname) { return /\.csv$/i.test(fname || '') || (!/^\s*[\[{]/.test(text) && /description/i.test(text.slice(0, 2000))) ? importCSV(text, fname) : importText(text, fname); }
function importText(text, fname) {
  let x; try { x = JSON.parse(text); } catch (e) { return toast('That file isn’t a Slate budget file'); }
  let list;
  if (x && x.slate && x.kind === 'library' && Array.isArray(x.budgets)) list = x.budgets;
  else if (x && x.slate && x.kind === 'budget' && x.budget) list = [x.budget];
  else if (x && Array.isArray(x.lines) && x.phases) { S.budgets.push(importSaturation(x)); save(); render(); return toast('1 budget imported from Saturation'); }
  else return toast('Not a Slate or Saturation file');
  list = list.filter(b => b && b.id && Array.isArray(b.rows) && Array.isArray(b.phases));
  if (!list.length) return toast('No budgets in that file');
  const same = list.filter(b => S.budgets.some(z => z.id === b.id)), fresh = list.filter(b => !same.includes(b));
  const finish = (replaced, copies) => {
    fresh.forEach(b => { if (S.deleted) delete S.deleted[b.id]; S.budgets.push(b); });
    replaced.forEach(b => { b.updated = Date.now(); const i = S.budgets.findIndex(z => z.id === b.id); if (i >= 0) S.budgets[i] = b; if (S.currentId === b.id) { U.undo = []; U.redo = []; } });
    copies.forEach(b => { b.id = uid(); b.name = b.name + ' (from file)'; S.budgets.push(b); });
    invalidate(); fixScope(); save(); render();
    const n = fresh.length + replaced.length + copies.length;
    toast(replaced.length && n === 1 ? '“' + replaced[0].name + '” updated from the file' : n + ' budget' + (n === 1 ? '' : 's') + ' opened from ' + (fname || 'the file'));
    if (!S.currentId && list.length === 1) openBudget((replaced[0] || fresh[0] || copies[0]).id);
  };
  if (!same.length) return finish([], []);
  if (NATIVE) saveNowSync();
  const when = t => t ? new Date(t).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'unknown';

.modal-back{background:rgba(10,10,14,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .16s ease-out}
.modal{background:var(--glass);border:1px solid var(--edge);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge);padding:22px 24px;animation:popIn .22s cubic-bezier(.2,.9,.3,1.2)}
.modal h2{font:700 22px/1.15 var(--font-display);letter-spacing:-.02em;text-transform:none}
.pal{padding:0}.pal input{border:0;border-bottom:1px solid var(--line);border-radius:26px 26px 0 0;background:transparent;box-shadow:none;padding:16px 20px;font-size:16px}
.pal .it{border-radius:10px}.pal .it.on{background:var(--focus);color:#fff}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#toast{background:var(--glass-hi);color:var(--text);border:1px solid var(--edge);border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
/* pages and cards */
.page{padding:14px 24px 40px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow-sm),inset 0 1px 0 var(--edge);padding:18px 20px}
.card h3{font:700 17px/1.2 var(--font-display);letter-spacing:-.015em;text-transform:none}
.hero h1{font:700 32px/1.1 var(--font-display);letter-spacing:-.03em;text-transform:none;margin:14px 0 6px}
table.simple th{font:600 11.5px var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:1px solid var(--line)}

table.simple td.num{font:13px var(--font-body);font-variant-numeric:tabular-nums}
table.simple tr.tot td{border-top:1px solid var(--line2)}
.bar,.mn-bar{height:8px;border:0;border-radius:99px;background:var(--head);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i,.mn-bar i{border-radius:99px}
.mn-mini{border:0;border-radius:99px;height:7px;background:var(--head);overflow:hidden}
.mn-stat{background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow-sm),inset 0 1px 0 var(--edge);padding:14px 16px}
.mn-stat small{font:600 12px var(--font-body);letter-spacing:0;text-transform:none}
.mn-stat b{font:700 26px/1.15 var(--font-display);letter-spacing:-.02em}
.mn-big{font:700 30px var(--font-display);letter-spacing:-.02em}
.rb-move{border:1px solid var(--edge);border-left:4px solid var(--accent);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm)}
.rb-short{border-left-color:var(--danger)}
.rb-move .amt{font:700 20px var(--font-display);letter-spacing:-.02em}
.banner,#rcbar,#updbar{border-radius:16px;border:1px solid var(--edge)!important;margin:8px 12px 0;box-shadow:var(--shadow-sm)}
#updbar{background:linear-gradient(180deg,var(--accent2),var(--accent))}
#updbar button{background:rgba(255,255,255,.9);color:#1d1d1f}
.kicker{font:600 11.5px var(--font-body);letter-spacing:.04em;color:var(--accent)}

.acctpage{margin:0 12px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--g,var(--accent)) 30%,transparent),color-mix(in srgb,var(--g,var(--accent)) 6%,transparent) 75%),var(--panel);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow-sm),inset 0 1px 0 var(--edge);overflow:visible}
.ap-nav{border-bottom:1px solid var(--line);padding:9px 12px}
.ap-title h2{color:color-mix(in srgb,var(--g,var(--accent)) 75%,var(--text));font:700 28px/1.1 var(--font-display);letter-spacing:-.025em;text-transform:none}
.ap-stats span,.ap-cap>label{font:600 12px var(--font-body);letter-spacing:0;text-transform:none}
.ap-stats b{font:700 20px var(--font-display);letter-spacing:-.02em}
.ap-cap input{font-size:15px;padding:7px 11px}
/* home */
.clapstrip,.bcard .stripe,#auth .stripe{display:none}
.mast{border-bottom:0;padding:22px 0 10px}
.mast h1{font:700 44px/1.05 var(--font-display);letter-spacing:-.035em;text-transform:none}
.mast .greet{font:400 17px/1.3 var(--font-body);font-style:normal;margin-top:6px}
.mstats{border:1px solid var(--edge);background:var(--panel);border-radius:20px;box-shadow:var(--shadow-sm);overflow:hidden}
.mstats div{border-right:1px solid var(--line);padding:10px 18px}
.mstats b{font:700 26px/1.1 var(--font-display);letter-spacing:-.02em}
.mstats span{font:600 11.5px var(--font-body);letter-spacing:0;text-transform:none}
.bcard{background:var(--panel);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow-sm),inset 0 1px 0 var(--edge);transition:transform .18s cubic-bezier(.2,.9,.3,1.2),box-shadow .18s}
.bcard:hover{border-color:var(--edge);transform:translateY(-3px);box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.bcard .in{padding:16px 18px 14px}
.bcard .no{font:600 11.5px var(--font-body);letter-spacing:0;text-transform:none}
.bcard .t{font:700 24px/1.1 var(--font-display);letter-spacing:-.025em;text-transform:none}
.bcard .big{font:700 28px var(--font-display);letter-spacing:-.025em}
.bcard .sm{font:12.5px var(--font-body)}
.bcard .acts{border-top:1px solid var(--line);gap:18px}
.bcard .mnl,.bcard .rcl,.bcard .who{font-family:var(--font-body);letter-spacing:0}
.ticket{border:1px dashed var(--line2);background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tplgrp{font:600 12px var(--font-body);letter-spacing:.02em}
button.tpl{border-radius:16px;padding:12px 16px}
button.tpl b{font:700 16px var(--font-display);letter-spacing:-.01em;text-transform:none}
button.tpl:hover{border-color:var(--edge2);box-shadow:var(--shadow-sm)}
/* lock screen */
#auth{background:var(--wall),var(--bg)}
#auth .box{background:var(--glass);border:1px solid var(--edge);border-radius:30px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
#auth .in{padding:30px 32px 28px}
#auth h1{font:700 32px/1.1 var(--font-display);letter-spacing:-.03em;text-transform:none}
#auth .sub{font:400 15px/1.35 var(--font-body);font-style:normal}
#auth label{font:600 12px var(--font-body);letter-spacing:0;text-transform:none}
#auth input{border-radius:12px;padding:11px 13px}
#auth .wide{border-radius:14px;padding:12px}
